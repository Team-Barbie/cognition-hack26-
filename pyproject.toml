[project]
name = "ar"
version = "0.1.0"
description = "Autoresearch with explicit contracts and specialized agents"
requires-python = ">=3.12"
dependencies = ["anthropic>=1.0", "pydantic>=2.6", "pyyaml>=6.0", "typer>=0.12"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ar = "ar.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ar = ["fixtures/**/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
