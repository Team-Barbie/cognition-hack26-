[project]
name = "ar"
version = "0.1.0"
description = "Autonomous research and engineering with one native Codex agent and optional delegation"
requires-python = ">=3.12"
dependencies = ["anthropic>=1.0", "fastapi>=0.117", "pydantic>=2.6", "pyyaml>=6.0", "typer>=0.12", "pypdf>=5", "defusedxml>=0.7.1"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ar = "ar.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ar = ["fixtures/**/*.json", "methods/*.md"]
"ar.studio" = ["app.html"]

[tool.vercel]
entrypoint = "app:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
