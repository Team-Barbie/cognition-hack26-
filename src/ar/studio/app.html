<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Res Loop</title>
<style>
/* Res Loop. A dark reading room: warm near-black page, drifting numerals, a pale paper panel with a shelf of
   book spines (the sources above, the agent team below), and a pixel-dither signal panel that plays while it works.
   System fonts only. Run data is inserted as text nodes and never parsed as markup. */
:root {
  --bg: #1b1514; --bg-2: #231b19; --line: rgba(239,233,222,.13); --line-2: rgba(239,233,222,.3);
  --cream: #efe9de; --mute: #a1978a;
  --paper: #f3f0e8; --paper-2: #e7e2d4; --ink: #16110f; --ink-2: #4b443b; --rule: #cbc4b3;
  --cobalt: #0a4fb5; --sky: #bfe3f7; --white: #fbfdff;
  --orange: #f0602d; --red: #e23b2e; --pink: #f58ab6; --yellow: #f2b632; --navy: #1d2c63; --green: #1f9d62; --lilac: #a98be0;
  --display: Optima, "Gill Sans", "Avenir Next", Candara, "Segoe UI", system-ui, sans-serif;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  --sans: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
  --mono: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 84px; }
body { margin: 0; background: var(--bg); color: var(--cream); font: 16px/1.55 var(--sans); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
button, input, textarea { font: inherit; color: inherit; }
a { color: inherit; }
::selection { background: var(--orange); color: #fff; }
:focus-visible { outline: 2px solid var(--orange); outline-offset: 3px; }
.hidden { display: none !important; }
.spacer { flex: 1; }
.micro { font: 500 10.5px/1.3 var(--sans); letter-spacing: .18em; text-transform: uppercase; }
.mono { font-family: var(--mono); }

/* drifting numerals */
.numerals { position: fixed; inset: -20px; z-index: 0; pointer-events: none; will-change: transform; transition: transform .6s cubic-bezier(.2,.8,.2,1); }
.num { position: absolute; font: 400 var(--s, 13px)/1 var(--display); color: rgba(239,233,222,.5); animation: drift var(--d, 24s) ease-in-out infinite alternate; transition: color .8s; }
body.working .num { color: rgba(240,96,45,.85); }
.layout { position: relative; z-index: 1; }

/* top bar */
.top { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 28px; padding: 14px max(16px, 3vw); background: rgba(27,21,20,.78); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.logo { font: 600 13px var(--display); letter-spacing: .32em; text-decoration: none; text-transform: uppercase; }
.top nav { display: flex; gap: 22px; }
.top nav a { font: 500 10.5px var(--sans); letter-spacing: .18em; text-transform: uppercase; text-decoration: none; color: var(--mute); transition: color .2s; }
.top nav a:hover { color: var(--cream); }
.mode { display: flex; align-items: center; gap: 9px; font: 500 10.5px var(--sans); letter-spacing: .18em; text-transform: uppercase; color: var(--mute); }
.mode i { width: 7px; height: 7px; border-radius: 50%; background: var(--mute); }
.mode.on { color: var(--cream); }
.mode.on i { background: #4ee08e; box-shadow: 0 0 0 3px rgba(78,224,142,.2); }

.layout { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 44px; max-width: 1600px; margin: 0 auto; padding: 56px max(16px, 3vw) 140px; align-items: start; }
@media (max-width: 1260px) { .layout { grid-template-columns: minmax(0, 1fr); } }
main { display: grid; grid-template-columns: minmax(0, 1fr); gap: clamp(64px, 9vw, 120px); min-width: 0; }

/* paper panels */
.paper { background: var(--paper); color: var(--ink); box-shadow: 0 40px 80px -40px rgba(0,0,0,.7); }
.p-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 16px; padding: 14px 24px 0; color: var(--ink-2); }
.stage { padding-bottom: 22px; }
.title { margin: 36px auto 0; padding: 0 24px; max-width: 24em; text-align: center; font: 400 clamp(30px, 4.6vw, 60px)/1.06 var(--display); letter-spacing: .035em; text-transform: uppercase; text-wrap: balance; animation: rise .9s cubic-bezier(.2,.8,.2,1) both; }
.title.long { font-size: clamp(22px, 2.7vw, 36px); }
.title.xl { font-size: clamp(17px, 1.8vw, 24px); letter-spacing: .05em; line-height: 1.25; }
.hint { margin: 14px auto 0; text-align: center; font: 500 11px var(--mono); letter-spacing: .04em; color: var(--ink-2); min-height: 1.5em; padding: 0 24px; }

.shelfrow { position: relative; display: flex; align-items: flex-end; gap: 7px; min-height: 270px; padding: 48px 28px 0; margin: 20px 24px 0; border-bottom: 3px solid var(--ink); overflow-x: auto; overflow-y: hidden; scrollbar-width: thin; transition: background .3s; }
.shelfrow::before { content: attr(data-label); position: absolute; right: 28px; top: 16px; font: 500 10px var(--sans); letter-spacing: .2em; text-transform: uppercase; color: var(--ink-2); }
.stage.drop .shelfrow.src { background: repeating-linear-gradient(135deg, rgba(240,96,45,.12) 0 10px, transparent 10px 20px); }
.shelfrow.team { margin-top: 10px; }
.baton { position: absolute; top: 20px; left: 0; width: 14px; height: 14px; margin-left: -7px; border-radius: 50%; background: var(--orange); z-index: 5; transition: left .7s cubic-bezier(.6,0,.2,1); animation: ping 1.3s ease-out infinite; }
.baton[hidden] { display: none; }
.now { margin: 14px 24px 0; min-height: 1.6em; font: 500 11.5px/1.5 var(--mono); color: var(--ink-2); overflow-wrap: anywhere; }
.now b { color: var(--orange); font-weight: 600; }

.spine { all: unset; box-sizing: border-box; position: relative; flex: none; width: var(--w); height: var(--h); background: var(--c); color: var(--fg);
  display: grid; place-items: center; border-radius: 2px 2px 0 0; transform-origin: 50% 100%;
  box-shadow: inset 5px 0 0 rgba(255,255,255,.16), inset -7px 0 0 rgba(0,0,0,.13), 0 1px 0 rgba(0,0,0,.25);
  transition: transform .55s cubic-bezier(.2,1.35,.4,1), box-shadow .4s, background .3s;
  animation: dropin .8s cubic-bezier(.2,1.2,.3,1) both; animation-delay: calc(min(var(--i, 0), 9) * 60ms); }
.spine .t { writing-mode: vertical-rl; transform: rotate(180deg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-height: calc(var(--h) - 52px); font: 700 12px/1 var(--sans); letter-spacing: .13em; text-transform: uppercase; }
.spine .mk { position: absolute; top: -17px; left: 50%; width: 7px; height: 7px; margin-left: -3.5px; border-radius: 50%; border: 1.5px solid var(--ink); }
button.spine { cursor: pointer; }
button.spine:not(:disabled):hover { transform: translateY(-9px); }
button.spine:disabled { cursor: default; }
.spine.ghost { background: transparent; color: rgba(22,17,15,.42); border: 1.5px dashed rgba(22,17,15,.3); box-shadow: none; }
.spine.ghost .mk { opacity: .25; }
.spine.waiting .mk { opacity: .6; }
.spine.running, .spine.lit { z-index: 3; }
.spine.running { transform: translateY(-30px) rotate(-3deg); box-shadow: inset 5px 0 0 rgba(255,255,255,.16), inset -7px 0 0 rgba(0,0,0,.13), 0 28px 22px -14px rgba(0,0,0,.55); animation: dropin .8s both, bob 1.8s ease-in-out .8s infinite alternate; }
.spine.running .mk { background: var(--orange); border-color: var(--orange); animation: ping 1.2s ease-out infinite; }
.spine.running::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(180deg, transparent, rgba(255,255,255,.4), transparent) 0 -60% / 100% 60% no-repeat; animation: sweep 1.3s linear infinite; }
.spine.lit { transform: translateY(-16px) rotate(2deg); box-shadow: inset 5px 0 0 rgba(255,255,255,.16), inset -7px 0 0 rgba(0,0,0,.13), 0 20px 18px -12px rgba(0,0,0,.5); }
.spine.lit .mk { background: var(--orange); border-color: var(--orange); }
.spine.done { animation: dropin .8s both, settle .7s ease-out; }
.spine.done .mk { background: var(--ink); }
.spine.failed { background-image: repeating-linear-gradient(135deg, rgba(0,0,0,.2) 0 6px, transparent 6px 12px); }
.spine.failed .mk { background: var(--red); border-color: var(--red); }
.spine .rm { all: unset; position: absolute; top: 5px; right: 5px; width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; background: rgba(0,0,0,.24); color: #fff; font: 400 15px/1 var(--sans); cursor: pointer; transition: background .2s, transform .2s; }
.spine .rm:hover { background: var(--red); transform: rotate(90deg); }
.spine .rm:focus-visible { outline: 2px solid var(--orange); outline-offset: 2px; }
.spine .rm:disabled { display: none; }

.p-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 14px 26px; padding: 22px 24px 0; }
.act { background: none; border: 0; padding: 4px 0; cursor: pointer; font: 600 10.5px var(--sans); letter-spacing: .18em; text-transform: uppercase; color: var(--ink); border-bottom: 1px solid transparent; transition: border-color .2s, color .2s; }
.act:hover { border-bottom-color: var(--orange); color: var(--orange); }
.go { background: var(--ink); color: var(--paper); border: 0; padding: 14px 30px; border-radius: 999px; cursor: pointer; font: 600 11px var(--sans); letter-spacing: .2em; text-transform: uppercase; transition: background .25s, transform .25s; }
.go:hover { background: var(--orange); transform: translateY(-2px); }
.go:disabled { background: var(--rule); color: var(--ink-2); cursor: not-allowed; transform: none; }
.paste { display: grid; gap: 10px; margin: 18px 24px 0; padding: 18px; background: var(--paper-2); }
.paste[hidden] { display: none; }
.paste input, .paste textarea { padding: 10px 12px; border: 1px solid var(--ink); background: var(--paper); color: var(--ink); font: 15px var(--serif); }
.paste textarea { min-height: 110px; resize: vertical; }

/* brief, in the dark */
.brief { max-width: 920px; }
.brief h2 { display: flex; align-items: center; gap: 14px; margin: 0 0 22px; color: var(--mute); }
.tag { padding: 3px 9px; border: 1px solid currentColor; font: 500 9.5px var(--sans); letter-spacing: .18em; }
.tag.ok { color: #4ee08e; }
.brief dl { margin: 0; display: grid; grid-template-columns: 130px minmax(0, 1fr); gap: 0 28px; }
.brief dt { padding: 14px 0; border-top: 1px solid var(--line); color: var(--mute); }
.brief dd { margin: 0; padding: 12px 0; border-top: 1px solid var(--line); font: 400 17px/1.5 var(--serif); }
.brief dd ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
.brief dd li { padding-left: 18px; position: relative; }
.brief dd li::before { content: ""; position: absolute; left: 0; top: .7em; width: 7px; height: 1px; background: var(--orange); }
.brief details summary { cursor: pointer; margin-top: 10px; color: var(--mute); list-style: none; }
.brief details summary::-webkit-details-marker { display: none; }
.brief details[open] summary { display: none; }
.brief .empty { color: var(--mute); font-style: italic; }
@media (max-width: 640px) { .brief dl { grid-template-columns: minmax(0, 1fr); } .brief dt { border-bottom: 0; padding-bottom: 0; } .brief dd { border-top: 0; } }

/* signal: the pixel poster */
.signal { position: relative; overflow: hidden; background: var(--sky); color: var(--cobalt); min-height: 400px; box-shadow: 0 40px 80px -40px rgba(0,0,0,.7); }
.signal canvas { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; opacity: .9; }
.sig-in { position: relative; display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr) 28px; gap: 28px; padding: 28px; min-height: 400px; font-family: var(--mono); text-shadow: 0 0 7px var(--sky), 0 0 3px var(--sky), 0 0 1px var(--sky); }
@media (max-width: 760px) { .sig-in { grid-template-columns: minmax(0, 1fr); } .sig-side { display: none; } .sig-r { grid-column: 1; } }
.sig-l { align-self: end; }
.code { font: 400 13.5px/1.7 var(--mono); padding: 16px 20px; background: rgba(191,227,247,.9); border-left: 3px solid var(--cobalt); }
.code .ln2 { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; animation: type .6s steps(28) both; }
.code .ln2.c { opacity: .75; }
.code .ln2.bad { color: #b3261e; }
.code .ln2.old { opacity: .35; }
.sig-r { align-self: center; justify-self: start; display: grid; gap: 18px; justify-items: start; padding: 22px 26px; background: rgba(191,227,247,.9); }
.big { font: 400 clamp(64px, 8vw, 104px)/.85 var(--display); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.cap { font: 500 11px var(--mono); letter-spacing: .1em; text-transform: uppercase; }
.loadbar { width: min(260px, 100%); display: grid; gap: 8px; font: 500 12px var(--mono); letter-spacing: .06em; }
.loadbar .trk { display: flex; align-items: center; gap: 10px; }
.loadbar .bar { flex: 1; height: 18px; background: rgba(251,253,255,.6); border: 1px solid var(--cobalt); overflow: hidden; position: relative; text-shadow: none; }
.loadbar .bar i { display: block; height: 100%; width: 0; background: var(--cobalt); transition: width .9s cubic-bezier(.3,.8,.2,1); }
body.working .loadbar .bar i { background-image: repeating-linear-gradient(90deg, transparent 0 9px, rgba(251,253,255,.35) 9px 11px); animation: march .6s linear infinite; }
.sig-side { writing-mode: vertical-rl; transform: rotate(180deg); align-self: center; font: 500 13px var(--mono); letter-spacing: .14em; background: rgba(191,227,247,.9); padding: 10px 3px; }

/* report */
.rep { padding-bottom: 36px; }
.rep .title { margin-top: 30px; }
.rep.focus .title { animation: focus 1.1s cubic-bezier(.2,.8,.2,1) both; }
.tabs { display: flex; gap: 26px; padding: 28px 24px 0; margin-top: 8px; border-bottom: 1px solid var(--rule); overflow-x: auto; }
.tab { background: none; border: 0; padding: 0 0 12px; cursor: pointer; font: 600 10.5px var(--sans); letter-spacing: .18em; text-transform: uppercase; color: var(--ink-2); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; transition: color .2s; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--orange); }
.tab sup { margin-left: 4px; color: var(--orange); font: 600 10px var(--mono); }
.pane { padding: 34px 24px 0; }
.pane[hidden] { display: none; }
.rep-grid { display: grid; grid-template-columns: minmax(0, 1fr) 270px; gap: 52px; }
@media (max-width: 960px) { .rep-grid { grid-template-columns: minmax(0, 1fr); } }
.article { font: 18px/1.75 var(--serif); min-width: 0; }
.article h1 { display: none; }
.article h2 { font: 400 22px/1.2 var(--display); letter-spacing: .1em; text-transform: uppercase; margin: 42px 0 12px; }
.article h2:first-child { margin-top: 0; }
.article h3 { font: 700 17px var(--serif); margin: 26px 0 6px; }
.article p { margin: 0 0 16px; max-width: 38em; }
.article ul, .article ol { padding-left: 1.2em; max-width: 38em; }
.article li { margin: 0 0 9px; }
.article code { font: .84em var(--mono); background: var(--paper-2); padding: 1px 5px; }
.cite { border: 0; background: none; padding: 0 1px; color: var(--orange); font: 700 .6em var(--sans); vertical-align: super; cursor: pointer; }
.cite:hover { text-decoration: underline; }
.cite.unknown { color: var(--ink-2); cursor: default; }
.rail { display: grid; gap: 30px; align-content: start; }
.rail .num-big { font: 300 96px/.85 var(--display); color: var(--orange); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.rail .cap { color: var(--ink-2); margin-top: 8px; font-family: var(--sans); font-size: 10.5px; letter-spacing: .16em; }
.layer { display: grid; grid-template-columns: minmax(0, 1fr) 44px; gap: 4px 10px; align-items: center; margin-top: 14px; }
.layer .lbl { grid-column: 1 / -1; font: 500 11.5px var(--mono); overflow-wrap: anywhere; }
.layer .bar { height: 14px; background: radial-gradient(circle, rgba(22,17,15,.28) 1px, transparent 1.4px) 0 0 / 5px 5px; position: relative; }
.layer .bar i { position: absolute; inset: 0 auto 0 0; background: radial-gradient(circle, var(--cobalt) 1.6px, transparent 2px) 0 0 / 5px 5px; transition: width 1s cubic-bezier(.2,.8,.2,1); width: 0; }
.layer .pc { font: 500 11.5px var(--mono); text-align: right; }
.list { list-style: none; margin: 0; padding: 0; border-top: 2px solid var(--ink); }
.list li { padding: 18px 0; border-bottom: 1px solid var(--rule); display: grid; gap: 8px; }
.list .top2 { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; }
.list .id { font: 400 28px/1 var(--display); color: var(--orange); }
.list .src { font: 500 11.5px var(--mono); color: var(--ink-2); }
.list .stmt { font: 17px/1.5 var(--serif); }
.list .why { font: 500 12.5px/1.5 var(--mono); color: var(--ink-2); overflow-wrap: anywhere; }
.list .rejected .id { text-decoration: line-through; text-decoration-color: var(--red); }
.rel { font: 600 10px var(--sans); letter-spacing: .16em; text-transform: uppercase; }
.rel.supports { color: #137a4a; } .rel.contradicts { color: var(--red); } .rel.qualifies { color: #9a6a00; }
.notes { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
.notes li { padding: 14px 0; border-top: 1px solid var(--rule); display: grid; gap: 4px; }
.notes b { font: 600 10px var(--sans); letter-spacing: .18em; text-transform: uppercase; color: var(--orange); }
.notes span { font: 16.5px/1.5 var(--serif); overflow-wrap: anywhere; }
blockquote { margin: 0; padding: 2px 0 2px 14px; border-left: 2px solid var(--orange); font: italic 16px/1.55 var(--serif); color: var(--ink-2); }
.hd { margin: 0 0 4px; font: 500 10.5px var(--sans); letter-spacing: .18em; text-transform: uppercase; color: var(--ink-2); }

/* chat */
.chat { position: sticky; top: 78px; align-self: start; height: calc(100vh - 104px); min-height: 460px; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; background: #151010; border: 1px solid var(--line-2); }
.chat-head { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.chat-status { display: flex; align-items: center; gap: 8px; color: var(--mute); }
.chat-status i { width: 7px; height: 7px; border-radius: 50%; background: #4ee08e; }
.chat-status.busy i { background: var(--orange); animation: blink 1s ease-in-out infinite; }
.chat-close { margin-left: auto; background: none; border: 0; font: 300 26px/1 var(--sans); cursor: pointer; display: none; }
.chat-msgs { overflow-y: auto; padding: 18px 16px; display: flex; flex-direction: column; gap: 14px; scrollbar-width: thin; }
.bubble { max-width: 90%; display: grid; gap: 5px; animation: rise .35s cubic-bezier(.2,.8,.2,1) both; }
.bubble .who { font: 500 9.5px var(--sans); letter-spacing: .2em; text-transform: uppercase; color: var(--orange); }
.bubble p { margin: 0; padding: 10px 14px; border: 1px solid var(--line-2); border-radius: 2px 16px 16px 16px; font: 15.5px/1.5 var(--serif); white-space: pre-wrap; overflow-wrap: anywhere; }
.bubble.you { align-self: flex-end; }
.bubble.you .who { text-align: right; color: var(--mute); }
.bubble.you p { background: var(--cream); color: var(--ink); border-color: var(--cream); border-radius: 16px 2px 16px 16px; }
.bubble.team p { border-left: 3px solid var(--bc, var(--orange)); border-radius: 2px; font-size: 14.5px; }
.bubble.typing p { display: flex; gap: 5px; padding: 14px 16px; width: max-content; }
.bubble.typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--mute); animation: blink 1.1s ease-in-out infinite; }
.bubble.typing i:nth-child(2) { animation-delay: .15s; } .bubble.typing i:nth-child(3) { animation-delay: .3s; }
.chat-foot { border-top: 1px solid var(--line); padding: 12px; display: grid; gap: 12px; }
.chips { display: flex; flex-wrap: wrap; gap: 7px; }
.chip { padding: 7px 12px; border: 1px solid var(--line-2); border-radius: 999px; background: none; cursor: pointer; font: 600 10px var(--sans); letter-spacing: .14em; text-transform: uppercase; white-space: nowrap; transition: background .2s, color .2s, border-color .2s; }
.chip:hover { background: var(--cream); color: var(--ink); border-color: var(--cream); }
.chip.go-chip { background: var(--orange); border-color: var(--orange); color: #fff; }
.chip.go-chip:hover { background: #ff7a45; border-color: #ff7a45; }
.chip:disabled { opacity: .5; cursor: not-allowed; }
.chat-form { display: grid; grid-template-columns: minmax(0, 1fr) 42px; gap: 8px; align-items: end; }
.chat-form textarea { resize: none; min-height: 42px; max-height: 150px; padding: 11px 13px; border: 1px solid var(--line-2); background: #0f0b0a; color: var(--cream); font: 15px/1.45 var(--serif); }
.chat-form textarea:focus { outline: none; border-color: var(--orange); }
.send { width: 42px; height: 42px; border: 0; border-radius: 50%; background: var(--cream); color: var(--ink); font: 700 18px var(--sans); cursor: pointer; transition: background .2s, transform .2s; }
.send:hover { background: var(--orange); color: #fff; transform: translateY(-2px); }
.chat-fab { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: max(16px, env(safe-area-inset-bottom, 0px)); z-index: 25; display: none; align-items: center; gap: 9px; padding: 14px 22px; border: 0; border-radius: 999px; background: var(--orange); color: #fff; cursor: pointer; font: 600 11px var(--sans); letter-spacing: .2em; text-transform: uppercase; box-shadow: 0 14px 30px -10px rgba(240,96,45,.6); }
.chat-fab b { background: #fff; color: var(--orange); font: 700 11px var(--mono); padding: 1px 7px; border-radius: 999px; }
.chat-fab b[hidden] { display: none; }
@media (max-width: 1260px) {
  .chat { position: fixed !important; right: 16px; bottom: 16px; top: auto; z-index: 26 !important; width: min(430px, calc(100vw - 32px)); height: min(660px, calc(100vh - 32px)); min-height: 0; transform: translateY(calc(100% + 60px)); transition: transform .35s cubic-bezier(.2,.8,.2,1); box-shadow: 0 30px 80px rgba(0,0,0,.7); }

  .chat-close { display: block; }

  body.chat-open .chat-fab { display: none; }

/* lock + sheets */
.lock { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; padding: 22px; background: var(--bg); }
.lock[hidden] { display: none; }
.lock-card { width: min(420px, 100%); padding: 34px; background: var(--paper); color: var(--ink); display: grid; gap: 16px; }
.lock-card h1 { margin: 0; font: 400 28px/1 var(--display); letter-spacing: .3em; text-transform: uppercase; }
.lock-card p { margin: 0; color: var(--ink-2); font-family: var(--serif); }
.lock-card input { width: 100%; padding: 12px 14px; border: 1px solid var(--ink); background: #fff; color: var(--ink); font: 18px var(--mono); letter-spacing: .14em; }
.lock-error { min-height: 1.4em; color: var(--red); font: 600 13px var(--sans); }
.drawer { position: fixed; inset: 0; z-index: 60; display: grid; justify-items: end; background: rgba(8,5,4,.6); backdrop-filter: blur(3px); }
.drawer[hidden] { display: none; }
.sheet { width: min(620px, 100%); height: 100%; overflow-y: auto; background: var(--paper); color: var(--ink); padding: 28px 32px 48px; display: grid; gap: 16px; align-content: start; animation: slide .35s cubic-bezier(.2,.8,.2,1) both; }
.sheet .no { font: 300 84px/.85 var(--display); color: var(--orange); letter-spacing: -.02em; }
.sheet .stmt { font: 22px/1.4 var(--serif); margin: 0; }
.sheet hr { border: 0; border-top: 1px solid var(--rule); margin: 4px 0; width: 100%; }
.sheet .kick { margin: 0; color: var(--orange); font: 600 10.5px var(--sans); letter-spacing: .2em; text-transform: uppercase; }
.sheet .act { justify-self: end; }
.lines { background: #fbf9f4; border: 1px solid var(--rule); padding: 8px 0; font: 12.5px/1.8 var(--mono); overflow-x: auto; }
.ln { display: grid; grid-template-columns: 3em minmax(0, 1fr); padding-right: 12px; }
.ln .n { text-align: right; padding-right: 12px; color: var(--ink-2); user-select: none; }
.ln .t { white-space: pre-wrap; overflow-wrap: anywhere; }
.ln.in { background: #f1e8d0; }
.ln.in .n { color: var(--orange); font-weight: 700; }
mark { background: #f7dc8b; color: var(--ink); box-shadow: 0 2px 0 var(--orange); }
.facts { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 16px; margin: 0; }
.facts dt { font: 600 10px/2 var(--sans); letter-spacing: .16em; text-transform: uppercase; color: var(--ink-2); }
.facts dd { margin: 0; font: 13px/2 var(--mono); overflow-wrap: anywhere; }
.packet-note { padding: 10px 12px; background: var(--paper-2); border-left: 3px solid var(--ink); font: 15px/1.5 var(--serif); color: var(--ink-2); }
.packet-section { display: grid; gap: 8px; padding-top: 14px; border-top: 1px solid var(--rule); }
.packet-section h4 { margin: 0; font: 600 10px var(--sans); letter-spacing: .18em; text-transform: uppercase; color: var(--orange); }
.packet-objective { margin: 0; padding: 10px 12px; background: #fbf9f4; border: 1px solid var(--rule); white-space: pre-wrap; overflow-wrap: anywhere; font: 15px/1.5 var(--serif); }
.packet-dep { display: grid; gap: 6px; padding: 10px 12px; background: #fbf9f4; border: 1px solid var(--rule); }
.packet-dep pre { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; font: 12.5px/1.6 var(--mono); }
.packet-lines { max-height: 260px; overflow: auto; }
.toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); z-index: 90; max-width: calc(100vw - 32px); background: var(--cream); color: var(--ink); padding: 11px 18px; font: 500 13.5px var(--sans); border-left: 4px solid var(--orange); box-shadow: 0 20px 40px rgba(0,0,0,.5); }
.toast[hidden] { display: none; }

@media (max-width: 760px) {
  .top { gap: 12px; padding: 12px 16px; }
  .top nav { display: none; }
  .logo { letter-spacing: .24em; white-space: nowrap; }
  .layout { padding-top: 28px; padding-bottom: 120px; }
  .p-head { padding: 12px 16px 0; }
  .title { padding: 0 16px; }
  .hint { padding: 0 16px; }
  .shelfrow { margin: 16px 12px 0; padding-left: 14px; padding-right: 14px; }
  .shelfrow::before { right: 14px; }
  .now, .p-foot { margin-left: 16px; margin-right: 16px; padding-left: 0; padding-right: 0; }
  .paste { margin: 16px; }
  .tabs { padding: 24px 16px 0; gap: 20px; }
  .pane { padding: 28px 16px 0; }
  .sig-in { padding: 18px; }
  .brief dd { font-size: 16px; }
}
@keyframes drift { from { transform: translate(0, 0); } to { transform: translate(var(--dx, 20px), var(--dy, 24px)); } }
@keyframes rise { from { opacity: .3; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@keyframes dropin { 0% { opacity: .2; transform: translateY(-140px) rotate(9deg); } 55% { opacity: 1; transform: translateY(7px) rotate(-1.2deg); } 80% { transform: translateY(-3px); } 100% { transform: none; } }
@keyframes bob { from { transform: translateY(-30px) rotate(-3.6deg); } to { transform: translateY(-34px) rotate(-1.4deg); } }
@keyframes settle { 0% { transform: translateY(-16px) rotate(-1.5deg); } 55% { transform: translateY(4px); } 100% { transform: none; } }
@keyframes sweep { to { background-position: 0 170%; } }
@keyframes ping { 0% { box-shadow: 0 0 0 0 rgba(240,96,45,.55); } 100% { box-shadow: 0 0 0 14px rgba(240,96,45,0); } }
@keyframes blink { 50% { opacity: .3; } }
@keyframes type { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
@keyframes march { to { background-position: 11px 0; } }
@keyframes focus { from { letter-spacing: .34em; opacity: .25; filter: blur(3px); } to { letter-spacing: .035em; opacity: 1; filter: none; } }
@keyframes slide { from { transform: translateX(48px); opacity: .4; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } html { scroll-behavior: auto; } }

<body>
<div class="lock" id="lock" hidden>
  <form class="lock-card" id="unlock-form">
    <h1>Res Loop</h1>
    <p>This studio asks for a password.</p>
    <input id="password" type="password" autocomplete="current-password" aria-label="Password" required>
    <div class="lock-error" id="lock-error" role="alert"></div>
    <button class="go" type="submit">Unlock</button>
  </form>
</div>

<div id="app">
  <div class="numerals" id="numerals" aria-hidden="true"></div>
  <header class="top">
    <a class="logo" href="#shelf">Res Loop</a>
    <nav aria-label="Sections"><a href="#shelf">Shelf</a><a href="#brief">Brief</a><a href="#signal">Signal</a><a href="#report">Report</a></nav>
    <span class="spacer"></span>
    <span class="mode" id="mode"><i></i><span>Connecting</span></span>
  </header>

  <div class="layout">
    <main>
      <section class="paper stage" id="shelf" aria-label="Shelf">
        <div class="p-head micro"><span>Res Loop</span><span id="stage-state">Ready</span><span>Part I</span></div>
        <h1 class="title" id="headline">What do you want to know?</h1>
        <p class="hint" id="hint"></p>
        <div class="shelfrow src" id="row-src" data-label="Sources" role="list"></div>
        <div class="shelfrow team" id="row-team" data-label="Team"><span class="baton" id="baton" hidden></span></div>
        <p class="now" id="now" aria-live="polite"></p>
        <div class="p-foot">
          <label class="act" for="file" tabindex="0" id="upload-label">Upload</label>
          <input id="file" type="file" accept=".md,.txt,.markdown,text/plain,text/markdown" multiple hidden>
          <button class="act" id="paste-toggle" type="button">Paste text</button>
          <button class="act" id="demo" type="button">Demo papers</button>
          <span class="spacer"></span>
          <button class="go" id="start" type="button">Start</button>
        </div>
        <form class="paste" id="paste" hidden>
          <input id="paste-name" placeholder="Name, e.g. smith-2024" required aria-label="Source name">
          <textarea id="paste-text" placeholder="Paste the text" required aria-label="Source text"></textarea>
          <div><button class="act" type="submit">Add to shelf</button></div>
        </form>
      </section>

      <section class="brief" id="brief" aria-label="Brief">
        <h2 class="micro">Brief <span class="tag" id="ready">Collecting</span></h2>
        <dl id="brief-items"></dl>
      </section>

      <section class="signal" id="signal" aria-label="Signal">
        <canvas id="dither" aria-hidden="true"></canvas>
        <div class="sig-in">
          <div class="sig-l"><div class="code" id="code" aria-live="off"></div></div>
          <div class="sig-r">
            <div><div class="big" id="stat-claims">0</div><div class="cap">claims verified</div></div>
            <div><div class="big" id="stat-rejected" style="font-size:clamp(40px,4.4vw,56px)">0</div><div class="cap">stopped at the gate</div></div>
            <div class="loadbar"><span id="sig-state">WAITING</span><div class="trk"><div class="bar"><i id="bar"></i></div><span id="pct">0%</span></div></div>
          </div>
          <div class="sig-side" id="sig-date"></div>
        </div>
      </section>

      <section class="paper rep hidden" id="report" aria-label="Report">
        <div class="p-head micro"><span>Res Loop</span><span id="report-outcome"></span><span id="report-meta"></span></div>
        <h2 class="title" id="report-title">Report</h2>
        <div class="tabs" role="tablist">
          <button class="tab" role="tab" data-pane="report" aria-selected="true">Report</button>
          <button class="tab" role="tab" data-pane="evidence" aria-selected="false">Evidence<sup id="n-evidence"></sup></button>
          <button class="tab" role="tab" data-pane="rejected" aria-selected="false">Rejected<sup id="n-rejected"></sup></button>
          <button class="tab" role="tab" data-pane="open" aria-selected="false">Open<sup id="n-open"></sup></button>
        </div>
        <div class="pane" id="pane-report"><div class="rep-grid"><article class="article" id="article"></article>
          <aside class="rail"><div><div class="num-big" id="report-n">0</div><div class="cap" id="report-cap">claims cited</div></div>
            <div><p class="hd">Where it came from</p><div id="layers"></div></div></aside></div></div>
        <div class="pane" id="pane-evidence" hidden><ul class="list" id="claims"></ul></div>
        <div class="pane" id="pane-rejected" hidden><ul class="list" id="rejections"></ul></div>
        <div class="pane" id="pane-open" hidden><div class="rep-grid"><ul class="notes" id="open"></ul><ul class="notes" id="limits"></ul></div></div>
      </section>
    </main>

    <aside class="chat" id="chat" aria-label="Chat">
      <header class="chat-head">
        <span class="logo">Res Loop</span>
        <span class="chat-status micro" id="chat-status"><i></i><span>Intake</span></span>
        <button class="chat-close" id="chat-close" type="button" aria-label="Close chat">×</button>
      </header>
      <div class="chat-msgs" id="msgs" aria-live="polite"></div>
      <div class="chat-foot">
        <div class="chips">
          <button class="chip" id="chip-demo" type="button">Demo papers</button>
          <label class="chip" for="file" tabindex="0" id="chip-upload">Upload</label>
          <button class="chip go-chip" id="chip-start" type="button">Start</button>
        </div>
        <form class="chat-form" id="composer">
          <textarea id="input" rows="1" placeholder="Ask a research question" aria-label="Message Res Loop"></textarea>
          <button class="send" type="submit" aria-label="Send">↑</button>
        </form>
      </div>
    </aside>
  </div>
  <button class="chat-fab" id="chat-fab" type="button" aria-label="Open chat">Chat <b id="unread" hidden>0</b></button>
</div>

<div class="drawer" id="drawer" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Details"></div></div>
<div class="toast" id="toast" role="alert" hidden></div>
<script>
(() => {
  "use strict";
  const $ = id => document.getElementById(id);
  // Build DOM nodes. Strings always become text nodes, never HTML.
  function h(tag, attrs, ...kids) {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v == null || v === false) continue;
      if (k === "class") el.className = v;
      else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? "" : String(v));
    }
    for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
    return el;
  }
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const narrow = matchMedia("(max-width: 1260px)");
  const state = { briefReady: false, sources: 0, running: false, reportShown: false, sourceList: [], question: "" };
  let sid = null, after = 0, report = null, busy = false, returnFocus = null, password = "", attempted = false;
  try { password = sessionStorage.getItem("studioPassword") || ""; } catch (_) { /* storage can be blocked */ }

  async function api(path, body) {
    const headers = { "Content-Type": "application/json", ...(password ? { Authorization: `Bearer ${password}` } : {}) };
    const res = await fetch(path, { method: body === undefined ? "GET" : "POST", headers, body: body === undefined ? undefined : JSON.stringify({ id: sid, ...body }) });
    const data = await res.json().catch(() => ({}));
    if (res.status === 401) lock();
    if (!res.ok) {
      if (/unknown session/.test(data.error || "")) restarted();
      throw new Error(data.error || `HTTP ${res.status}`);
    }
    return data;
  }
  // The lock appears only if the server asks for a password (HTTP 401).
  function lock() {
    password = ""; try { sessionStorage.removeItem("studioPassword"); } catch (_) {}
    $("lock").hidden = false; $("app").setAttribute("aria-hidden", "true"); $("app").inert = true;
    setTimeout(() => $("password").focus(), 0);
  }
  function unlock() { $("lock").hidden = true; $("app").removeAttribute("aria-hidden"); $("app").inert = false; }
  let recovering = false;
  function restarted() {
    if (recovering) return;
    recovering = true;
    toast("Res Loop restarted and this page's session is gone. Opening a fresh one.");
    setTimeout(() => { location.href = location.pathname; }, 1600);
  }
  function toast(msg) { const t = $("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => { t.hidden = true; }, 4500); }

  // ---- atmosphere: drifting numerals, parallax, ticking while it works
  const NUMS = ["1", "2", "3", "4", "5", "6", "7", "II", "IV", "VI", "IX", "X", "8", "9"];
  function spawnNumerals() {
    let seed = 11; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    for (let i = 0; i < 24; i++) $("numerals").append(h("span", { class: "num",
      style: `left:${(rnd() * 96 + 2).toFixed(1)}%;top:${(rnd() * 96 + 2).toFixed(1)}%;--dx:${(rnd() * 56 - 28).toFixed(0)}px;--dy:${(rnd() * 64 - 32).toFixed(0)}px;--d:${(16 + rnd() * 26).toFixed(0)}s;--s:${(11 + rnd() * 7).toFixed(0)}px` }, NUMS[i % NUMS.length]));
  }
  if (!reduce) {
    let raf = 0;
    addEventListener("pointermove", e => {
      if (raf) return;
      raf = requestAnimationFrame(() => { raf = 0; $("numerals").style.transform = `translate(${((e.clientX / innerWidth) - .5) * -22}px, ${((e.clientY / innerHeight) - .5) * -22}px)`; });
    }, { passive: true });
    setInterval(() => {
      if (!document.body.classList.contains("working")) return;
      const n = document.querySelectorAll(".num"); const el = n[Math.floor(Math.random() * n.length)];
      if (el && /^\d+$/.test(el.textContent)) el.textContent = String((+el.textContent + 1) % 10);
    }, 700);
  }

  // ---- the pixel signal panel: ordered dither, alive while the team works
  function startDither() {
    const cv = $("dither"), ctx = cv.getContext("2d", { alpha: false });
    const W = 150, H = 62; cv.width = W; cv.height = H;
    const img = ctx.createImageData(W, H), d = img.data;
    const B = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
    const SKY = [191, 227, 247], WHITE = [251, 253, 255], COB = [10, 79, 181];
    let last = 0, visible = true;
    new IntersectionObserver(es => { visible = es[0].isIntersecting; }).observe(cv);
    function draw(t) {
      const tt = t * .0006 * (document.body.classList.contains("working") ? 2.4 : 1);
      for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
        const nx = x / W, ny = y / H;
        const v = .5 + .28 * Math.sin(nx * 9 + tt * 2) + .22 * Math.sin(ny * 13 - tt * 1.6 + Math.sin(nx * 5 + tt) * 2.2) + .12 * Math.sin((nx + ny) * 22 - tt * 3);
        const th = (B[(y & 3) * 4 + (x & 3)] + .5) / 16;
        const c = v > .62 + .3 * th ? WHITE : (v < .3 * (1 - th) ? COB : SKY);
        const o = (y * W + x) * 4; d[o] = c[0]; d[o + 1] = c[1]; d[o + 2] = c[2]; d[o + 3] = 255;
      }
      ctx.putImageData(img, 0, 0);
    }
    if (reduce) { draw(5200); return; }
    (function loop(t) { requestAnimationFrame(loop); if (!visible || document.hidden || t - last < 70) return; last = t; draw(t); })(0);
  }

  // ---- chat
  let unread = 0;
  function typing(on) {
    $("typing")?.remove();
    if (on) $("msgs").append(h("div", { class: "bubble typing", id: "typing" }, h("span", { class: "who" }, "Intake"), h("p", {}, h("i"), h("i"), h("i"))));
    $("msgs").scrollTop = $("msgs").scrollHeight;
  }
  function addTurn(e, color) {
    const kind = e.role === "user" ? "you" : (["Intake", "Orchestrator", "Res Loop", "Scout"].includes(e.who) ? "agent" : "team");
    if (kind !== "you") typing(false);
    const b = h("div", { class: `bubble ${kind}` }, h("span", { class: "who" }, e.who || "Agent"), h("p", {}, e.text));
    if (color) b.style.setProperty("--bc", color);
    $("msgs").append(b); $("msgs").scrollTop = $("msgs").scrollHeight;
    if (narrow.matches && !document.body.classList.contains("chat-open") && kind !== "you") { unread += 1; $("unread").textContent = unread; $("unread").hidden = false; }
  }
  function openChat(open) {
    document.body.classList.toggle("chat-open", open);
    if (open) { unread = 0; $("unread").hidden = true; $("input").focus(); }
  }
  const asked = new Set();
  const ROLE_COLOR = { scout: "var(--lilac)", planner: "var(--yellow)", evidence_reader: "var(--orange)", writer: "var(--navy)", reviewer: "var(--red)", quality: "var(--green)" };
  function askInChat(e) {
    for (const q of (e.questions || []).slice(0, 2)) {
      const key = e.id + "|" + q; if (asked.has(key)) continue; asked.add(key);
      addTurn({ role: "assistant", who: `${e.title} asks`, text: q }, ROLE_COLOR[e.role]);
    }
  }
  function chatStatus(text, busy) { $("chat-status").className = "chat-status micro" + (busy ? " busy" : ""); $("chat-status").lastChild.textContent = text; }

  // ---- brief, shown in the dark under the shelf
  function renderBrief(b, ready) {
    state.question = b.question || "";
    const t = $("headline"); t.textContent = b.question || "What do you want to know?";
    const n = (b.question || "").length; t.className = "title" + (n > 200 ? " xl" : n > 80 ? " long" : "");
    const dl = $("brief-items"); dl.replaceChildren();
    const row = (label, body) => dl.append(h("dt", { class: "micro" }, label), h("dd", {}, body));
    if (b.context) row("Context", b.context);
    if (b.constraints && b.constraints.length) {
      const first = b.constraints.slice(0, 4), rest = b.constraints.slice(4);
      row("Constraints", [h("ul", {}, first.map(c => h("li", {}, c))),
        rest.length ? h("details", {}, h("summary", { class: "micro" }, `${rest.length} more`), h("ul", { style: "margin-top:8px" }, rest.map(c => h("li", {}, c)))) : null]);
    }
    if (b.open_questions && b.open_questions.length) row("To answer", h("ul", {}, b.open_questions.map(q => h("li", {}, q))));
    if (!dl.children.length) dl.append(h("dd", { class: "empty", style: "grid-column:1/-1;border-top:1px solid var(--line)" }, "Nothing yet. Your question, context and constraints land here as you talk."));
    $("ready").textContent = ready ? "Ready" : "Collecting"; $("ready").className = "tag" + (ready ? " ok" : "");
    state.briefReady = ready || !!b.question;
    updateHint(); updateStart();
  }
  function updateHint() {
    let t;
    if (state.running) t = "Working. Open any spine in the team row to see exactly what that agent was given.";
    else if (state.reportShown) t = "Done. The report is below.";
    else if (!state.question) t = narrow.matches ? "Tap Chat to ask your question." : "Ask your question in the chat.";
    else if (!state.sources) t = "Add papers, or press Start without them: a scout writes labelled background notes.";
    else t = "Press Start when the shelf looks right.";
    $("hint").textContent = t;
    $("stage-state").textContent = state.running ? "Running" : state.reportShown ? "Done" : "Ready";
  }
  function updateStart() {
    const label = state.running ? "Running" : (state.reportShown ? "Run again" : "Start");
    for (const id of ["start", "chip-start"]) { $(id).disabled = state.running; $(id).textContent = label; }
  }
  function missing() { return state.briefReady ? null : "First ask your question in the chat."; }

  // ---- the shelf: sources above, the team below
  const PALETTE = [["#f58ab6", "#2a0f1c"], ["#1d2c63", "#f3f0e8"], ["#f2b632", "#2b1d00"], ["#e23b2e", "#fff4ee"], ["#2a63c7", "#f3f0e8"], ["#f0602d", "#2a0f00"], ["#1f9d62", "#f3f0e8"], ["#a98be0", "#1d1233"]];

    if (want) openProof(decodeURIComponent(want[1])); else sec.scrollIntoView({ block: "start" });
  }

  // ---- events
  function apply(e) {
    if (e.type === "chat") addTurn(e);
    else if (e.type === "brief") renderBrief(e.brief, e.ready);
    else if (e.type === "sources") renderSources(e.sources);
    else if (e.type === "agent") upsertAgent(e);
    else if (e.type === "quality") addTicker(e);
    else if (e.type === "run") { if (e.status === "started") { report = null; resetTeam(); } setRun(e.status); }
    else if (e.type === "report") renderReport(e.report);
  }
  async function poll() {
    if (sid && !busy) {
      busy = true;
      try { const d = await api(`/api/events?id=${encodeURIComponent(sid)}&after=${after}`); for (const e of d.events) { apply(e); after = e.seq; } }
      catch (err) { /* server restarting; keep polling */ }
      busy = false;
    }
    setTimeout(poll, state.running ? 400 : 900);
  }

  // ---- inputs
  $("composer").addEventListener("submit", async e => {
    e.preventDefault();
    const text = $("input").value.trim(); if (!text) return;
    $("input").value = ""; $("input").style.height = ""; typing(true);
    try { await api("/api/chat", { message: text }); } catch (err) { typing(false); toast(err.message); }
  });
  $("input").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("composer").requestSubmit(); } });
  $("input").addEventListener("input", e => { e.target.style.height = "auto"; e.target.style.height = Math.min(150, e.target.scrollHeight) + "px"; });
  for (const id of ["upload-label", "chip-upload"]) $(id).addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); $("file").click(); } });
  async function addFiles(files) {
    for (const f of files) { try { await api("/api/source", { name: f.name, text: await f.text() }); } catch (err) { toast(err.message); } }
  }
  $("file").addEventListener("change", async e => { await addFiles(e.target.files); e.target.value = ""; });
  const stage = $("shelf");
  stage.addEventListener("dragover", e => { e.preventDefault(); stage.classList.add("drop"); });
  stage.addEventListener("dragleave", e => { if (!stage.contains(e.relatedTarget)) stage.classList.remove("drop"); });
  stage.addEventListener("drop", async e => { e.preventDefault(); stage.classList.remove("drop"); await addFiles(e.dataTransfer.files); });
  $("paste-toggle").addEventListener("click", () => { $("paste").hidden = !$("paste").hidden; if (!$("paste").hidden) $("paste-name").focus(); });
  $("paste").addEventListener("submit", async e => {
    e.preventDefault();
    try { await api("/api/source", { name: $("paste-name").value, text: $("paste-text").value }); $("paste").reset(); $("paste").hidden = true; } catch (err) { toast(err.message); }
  });
  const useDemo = async () => { try { await api("/api/demo", {}); } catch (err) { toast(err.message); } };
  $("demo").addEventListener("click", useDemo); $("chip-demo").addEventListener("click", useDemo);
  $("chip-start").addEventListener("click", () => $("start").click());
  $("chat-fab").addEventListener("click", () => openChat(true)); $("chat-close").addEventListener("click", () => openChat(false));
  $("start").addEventListener("click", async () => {
    const why = missing();
    if (why) { addTurn({ role: "assistant", who: "Res Loop", text: why }); openChat(true); toast(why); return; }
    state.running = true; updateStart();
    try { await api("/api/run", {}); } catch (err) { state.running = false; updateStart(); toast(err.message); }
  });

  async function startStudio() {
    try {
      const attach = new URLSearchParams(location.search).get("session");  // reopen an existing session
      const s = attach ? { id: attach, ...(await api("/api/info")) } : await api("/api/session", {});
      sid = s.id;
      const live = String(s.mode || "").startsWith("live");
      $("mode").className = "mode" + (live ? " on" : "");
      $("mode").lastChild.textContent = live ? `Live · ${s.mode.split("·")[1].trim()}` : "Demo · fake agent";
      unlock(); renderBrief({}, false); poll();
      if (location.hash === "#chat") openChat(true); else if (!narrow.matches) $("input").focus();
    } catch (err) {
      if (!$("lock").hidden) { if (attempted) $("lock-error").textContent = "Incorrect password."; }
      else toast("Could not reach the studio server.");
    }
  }
  $("unlock-form").addEventListener("submit", async e => {
    e.preventDefault(); $("lock-error").textContent = "";
    attempted = true; password = $("password").value;
    try { sessionStorage.setItem("studioPassword", password); } catch (_) {}
    await startStudio();
  });

  spawnNumerals(); startDither();
  const d = new Date(); $("sig-date").textContent = `${String(d.getDate()).padStart(2, "0")}/${String(d.getMonth() + 1).padStart(2, "0")}/${String(d.getFullYear()).slice(2)}`;
  $("code").dataset.idle = "1"; setCode(IDLE);
  renderSources([]); renderBrief({}, false); updateHint();
  startStudio();
})();
</script>
</body>
</html>
