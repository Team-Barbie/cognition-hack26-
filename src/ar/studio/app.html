<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Res Loop</title>
<style>
/* Res Loop. A light, cool page with soft white cards, a navy floating nav and chat, and a sky-blue pixel signal panel.
   Everything is rounded. The sources and the agent team stand as book spines on shelves.
   System fonts only. Run data is inserted as text nodes and never parsed as markup. */
:root {
  --bg: #eaf1f8; --card: #ffffff; --soft: #f2f6fb; --ink: #0b1b3d; --ink-2: #4a5b7e; --rule: #dce6f2;
  --navy: #0b1b3d; --navy-2: #15294f; --on-navy: #eef3fb; --on-navy-2: #9fb0cf; --line-d: rgba(238,243,251,.14); --line-d2: rgba(238,243,251,.3);
  --cobalt: #1550c9; --cobalt-d: #0a3f94; --sky: #c7e5f7;
  --orange: #f26a3d; --red: #e5483b; --pink: #f58ab6; --yellow: #f4b73f; --green: #26a672; --lilac: #a98be0;
  --r1: 12px; --r2: 18px; --r3: 28px;
  --shadow: 0 1px 2px rgba(11,27,61,.05), 0 18px 40px -18px rgba(11,27,61,.22);
  --display: Optima, "Gill Sans", "Avenir Next", Candara, "Segoe UI", system-ui, sans-serif;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  --sans: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
  --mono: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 96px; }
body { margin: 0; background: radial-gradient(900px 500px at 85% -5%, #d6e8f8 0%, transparent 65%), var(--bg); color: var(--ink); font: 16px/1.55 var(--sans); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
button, input, textarea { font: inherit; color: inherit; }
a { color: inherit; }
::selection { background: var(--cobalt); color: #fff; }
:focus-visible { outline: 2px solid var(--cobalt); outline-offset: 3px; }
.hidden { display: none !important; }
.spacer { flex: 1; }
.micro { font: 500 12px/1.3 var(--sans); letter-spacing: .06em; text-transform: uppercase; }

/* drifting numerals */
.numerals { position: fixed; inset: -20px; z-index: 0; pointer-events: none; will-change: transform; transition: transform .6s cubic-bezier(.2,.8,.2,1); }
.num { position: absolute; font: 400 var(--s, 13px)/1 var(--display); color: rgba(21,80,201,.3); animation: drift var(--d, 24s) ease-in-out infinite alternate; transition: color .8s; }
body.working .num { color: rgba(21,80,201,.75); }
.layout { position: relative; z-index: 1; }

/* floating nav */
.top { position: sticky; top: 12px; z-index: 20; display: flex; align-items: center; gap: 28px; margin: 12px max(16px, 3vw) 0; padding: 12px 24px; background: rgba(11,27,61,.94); color: var(--on-navy); border-radius: 999px; box-shadow: var(--shadow); backdrop-filter: blur(10px); }
.logo { font: 600 14px var(--display); letter-spacing: .26em; text-decoration: none; text-transform: uppercase; }
.top nav { display: flex; gap: 24px; }
.top nav a { font: 500 14px var(--sans); text-decoration: none; color: var(--on-navy-2); transition: color .2s; }
.top nav a:hover { color: #fff; }

.layout { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 28px; max-width: 1600px; margin: 0 auto; padding: 28px max(16px, 3vw) 120px; align-items: start; }
@media (max-width: 1260px) { .layout { grid-template-columns: minmax(0, 1fr); } }
main { display: grid; grid-template-columns: minmax(0, 1fr); gap: 28px; min-width: 0; }

/* cards */
.paper { background: var(--card); color: var(--ink); border-radius: var(--r3); box-shadow: var(--shadow); overflow: hidden; }
.p-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 16px; padding: 16px 28px; border-bottom: 1px solid var(--rule); color: var(--ink-2); }
.stage { padding-bottom: 26px; }
.title { margin: 40px auto 0; padding: 0 28px; max-width: 24em; text-align: center; font: 400 clamp(30px, 4.4vw, 58px)/1.08 var(--display); letter-spacing: .035em; text-transform: uppercase; text-wrap: balance; animation: rise .9s cubic-bezier(.2,.8,.2,1) both; }
.title.long { font-size: clamp(22px, 2.6vw, 34px); }
.title.xl { font-size: clamp(17px, 1.8vw, 24px); letter-spacing: .05em; line-height: 1.25; }
.hint { margin: 12px auto 30px; text-align: center; font: 400 14px var(--sans); color: var(--ink-2); min-height: 1.5em; padding: 0 28px; }

.shelfrow { position: relative; display: flex; justify-content: safe center; align-items: flex-end; gap: 8px; min-height: 262px; padding: 46px 28px 0; margin: 0 28px; border-bottom: 4px solid var(--ink); border-radius: 0 0 4px 4px; overflow-x: auto; overflow-y: hidden; scrollbar-width: thin; transition: background .3s; }
.shelfrow::before { content: attr(data-label); position: absolute; right: 28px; top: 16px; font: 500 12px var(--sans); color: var(--ink-2); }
.stage.drop .shelfrow.src { background: repeating-linear-gradient(135deg, rgba(21,80,201,.08) 0 10px, transparent 10px 20px); }
.now { margin: 14px 28px 0; min-height: 1.5em; font: 400 13px/1.5 var(--sans); color: var(--ink-2); overflow-wrap: anywhere; }
.now b { color: var(--cobalt); font-weight: 600; }

.spine { all: unset; box-sizing: border-box; position: relative; flex: none; width: var(--w); height: var(--h); background: var(--c); color: var(--fg);
  display: grid; place-items: center; border-radius: 14px 14px 3px 3px; transform-origin: 50% 100%; overflow: hidden;
  box-shadow: inset 6px 0 0 rgba(255,255,255,.18), inset -8px 0 0 rgba(0,0,0,.1);
  transition: transform .55s cubic-bezier(.2,1.35,.4,1), box-shadow .4s, background .3s;
  animation: dropin .8s cubic-bezier(.2,1.2,.3,1) both; animation-delay: calc(min(var(--i, 0), 9) * 60ms); cursor: default; }
.spine::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 7px; background: transparent; transition: background .4s; }
.spine .t { writing-mode: vertical-rl; transform: rotate(180deg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-height: calc(var(--h) - 56px); font: 700 12.5px/1 var(--sans); letter-spacing: .08em; text-transform: uppercase; }
button.spine { cursor: pointer; }
button.spine:not(:disabled):hover { transform: translateY(-9px); }
button.spine:disabled { cursor: default; }
.spine.ghost { background: var(--soft); color: rgba(11,27,61,.4); box-shadow: inset 0 0 0 1.5px rgba(11,27,61,.16); }
.spine.running, .spine.lit { z-index: 3; overflow: visible; }
.spine.running { transform: translateY(-30px) rotate(-3deg); box-shadow: inset 6px 0 0 rgba(255,255,255,.18), inset -8px 0 0 rgba(0,0,0,.1), 0 26px 24px -14px rgba(11,27,61,.5); animation: dropin .8s both, bob 1.8s ease-in-out .8s infinite alternate; }
.spine.running::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; background: linear-gradient(180deg, transparent, rgba(255,255,255,.45), transparent) 0 -60% / 100% 60% no-repeat; animation: sweep 1.3s linear infinite; }
.spine.lit { transform: translateY(-16px) rotate(2deg); box-shadow: inset 6px 0 0 rgba(255,255,255,.18), inset -8px 0 0 rgba(0,0,0,.1), 0 20px 18px -12px rgba(11,27,61,.45); }
.spine.done { animation: dropin .8s both, settle .7s ease-out; }
.spine.done::before { background: rgba(0,0,0,.26); }
.spine.failed { background-image: repeating-linear-gradient(135deg, rgba(0,0,0,.2) 0 6px, transparent 6px 12px); }
.spine .rm { all: unset; position: absolute; top: 9px; right: 5px; width: 24px; height: 24px; display: grid; place-items: center; border-radius: 50%; color: var(--fg); opacity: .65; font: 400 20px/1 var(--sans); cursor: pointer; transition: opacity .2s, background .2s; }
.spine .rm:hover { opacity: 1; background: rgba(0,0,0,.18); }
.spine .rm:focus-visible { outline: 2px solid var(--cobalt); outline-offset: 1px; }
.spine .rm:disabled { display: none; }

.p-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; margin: 16px 28px 0; padding-top: 18px; border-top: 1px solid var(--rule); }
.act { background: none; border: 0; padding: 3px 0; cursor: pointer; font: 500 14.5px var(--sans); color: var(--ink); border-bottom: 1.5px solid var(--rule); transition: border-color .2s, color .2s; }
.act:hover { border-bottom-color: var(--cobalt); color: var(--cobalt); }
.go { background: var(--cobalt); color: #fff; border: 0; padding: 13px 34px; border-radius: 999px; cursor: pointer; font: 600 15px var(--sans); transition: background .25s, transform .25s, box-shadow .25s; box-shadow: 0 10px 22px -10px rgba(21,80,201,.7); }
.go:hover { background: var(--cobalt-d); transform: translateY(-1px); }
.go:disabled { background: var(--rule); color: var(--ink-2); cursor: not-allowed; transform: none; box-shadow: none; }
.paste { display: grid; gap: 10px; margin: 18px 28px 0; padding: 18px; background: var(--soft); border-radius: var(--r2); }
.paste[hidden] { display: none; }
.paste input, .paste textarea { padding: 11px 14px; border: 1px solid var(--rule); border-radius: var(--r1); background: #fff; color: var(--ink); font: 15px var(--serif); }
.paste textarea { min-height: 110px; resize: vertical; }

/* brief */
.brief { padding: 22px 28px 14px; background: var(--card); border-radius: var(--r3); box-shadow: var(--shadow); }
.brief h2 { display: flex; align-items: center; gap: 12px; margin: 0 0 8px; color: var(--ink-2); }
.tag { padding: 3px 11px; border-radius: 999px; background: var(--soft); font: 500 12px var(--sans); letter-spacing: 0; text-transform: none; }
.tag.ok { background: #dff3ea; color: #12714a; }
.brief dl { margin: 0; display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 0 24px; }
.brief dt { padding: 12px 0; border-top: 1px solid var(--rule); color: var(--ink-2); font-size: 13px; }
.brief dd { margin: 0; padding: 10px 0; border-top: 1px solid var(--rule); font: 400 17px/1.5 var(--serif); }
.brief dd ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
.brief dd li { padding-left: 16px; position: relative; }
.brief dd li::before { content: ""; position: absolute; left: 0; top: .72em; width: 7px; height: 1.5px; background: var(--cobalt); border-radius: 2px; }
.brief details summary { cursor: pointer; margin-top: 8px; color: var(--cobalt); font: 500 14px var(--sans); list-style: none; }
.brief details summary::-webkit-details-marker { display: none; }
.brief details[open] summary { display: none; }
.brief .empty { color: var(--ink-2); font-style: italic; }
@media (max-width: 640px) { .brief dl { grid-template-columns: minmax(0, 1fr); } .brief dt { border-bottom: 0; padding-bottom: 0; } .brief dd { border-top: 0; } }

/* signal: the pixel poster */
.signal { position: relative; overflow: hidden; background: #c7e5f7; color: #0a3f94; min-height: 340px; border-radius: var(--r3); box-shadow: var(--shadow); }
.signal canvas { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; }
.sig-in { position: relative; display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr) 28px; gap: 28px; padding: 32px; min-height: 340px; font-family: var(--mono); }
@media (max-width: 760px) { .sig-in { grid-template-columns: minmax(0, 1fr); } .sig-side { display: none; } .sig-r { grid-column: 1; } }
.sig-l { align-self: end; }
.code { font: 400 14px/1.75 var(--mono); max-width: 56ch; }
.code .ln2 { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; animation: type .6s steps(28) both; }
.code .ln2.c { opacity: .7; }
.code .ln2.bad { color: #a8201a; }
.code .ln2.old { opacity: .3; }
.sig-r { align-self: center; display: grid; gap: 20px; justify-items: start; }
.big { font: 400 clamp(56px, 7vw, 88px)/.85 var(--display); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.cap { font: 500 12px var(--mono); letter-spacing: .06em; text-transform: uppercase; }
.loadbar { width: min(260px, 100%); display: grid; gap: 8px; font: 500 12px var(--mono); letter-spacing: .06em; }
.loadbar .trk { display: flex; align-items: center; gap: 10px; }
.loadbar .bar { flex: 1; height: 14px; background: #eaf5fc; border-radius: 999px; overflow: hidden; position: relative; }
.loadbar .bar i { display: block; height: 100%; width: 0; background: #0a3f94; border-radius: 999px; transition: width .9s cubic-bezier(.3,.8,.2,1); }
body.working .loadbar .bar i { background-image: repeating-linear-gradient(90deg, transparent 0 9px, rgba(251,253,255,.35) 9px 11px); animation: march .6s linear infinite; }
.sig-side { writing-mode: vertical-rl; transform: rotate(180deg); align-self: center; font: 500 12px var(--mono); letter-spacing: .12em; }

/* report */
.rep { padding-bottom: 36px; }
.rep .title { margin-top: 32px; }
.rep.focus .title { animation: focus 1.1s cubic-bezier(.2,.8,.2,1) both; }
.tabs { display: flex; gap: 4px; width: max-content; max-width: calc(100% - 56px); margin: 24px 28px 0; padding: 4px; background: var(--soft); border-radius: 999px; overflow-x: auto; }
.tab { background: none; border: 0; padding: 9px 18px; border-radius: 999px; cursor: pointer; font: 500 14.5px var(--sans); color: var(--ink-2); white-space: nowrap; transition: background .2s, color .2s; }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { background: var(--cobalt); color: #fff; }
.tab sup { margin-left: 5px; font: 600 11px var(--mono); }
.pane { padding: 28px 28px 0; }
.pane[hidden] { display: none; }
.rep-grid { display: grid; grid-template-columns: minmax(0, 1fr) 270px; gap: 48px; }
@media (max-width: 960px) { .rep-grid { grid-template-columns: minmax(0, 1fr); } }
.article { font: 18px/1.75 var(--serif); min-width: 0; }
.article h1 { display: none; }
.article h2 { font: 400 22px/1.2 var(--display); letter-spacing: .1em; text-transform: uppercase; margin: 40px 0 12px; }
.article h2:first-child { margin-top: 0; }
.article h3 { font: 700 17px var(--serif); margin: 26px 0 6px; }
.article p { margin: 0 0 16px; max-width: 38em; }
.article ul, .article ol { padding-left: 1.2em; max-width: 38em; }
.article li { margin: 0 0 9px; }
.article code { font: .84em var(--mono); background: var(--soft); padding: 2px 7px; border-radius: 6px; }
.cite { border: 0; background: #e6eefc; padding: 1px 6px; border-radius: 999px; color: var(--cobalt); font: 700 .62em var(--sans); vertical-align: super; cursor: pointer; transition: background .2s, color .2s; }
.cite:hover { background: var(--cobalt); color: #fff; }
.cite.unknown { background: var(--soft); color: var(--ink-2); cursor: default; }
.rail { display: grid; gap: 28px; align-content: start; padding: 22px; background: var(--soft); border-radius: var(--r2); }
.rail .num-big { font: 300 88px/.85 var(--display); color: var(--cobalt); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.rail .cap { color: var(--ink-2); margin-top: 8px; font: 500 13px var(--sans); letter-spacing: 0; text-transform: none; }
.layer { display: grid; grid-template-columns: minmax(0, 1fr) 44px; gap: 4px 10px; align-items: center; margin-top: 14px; }
.layer .lbl { grid-column: 1 / -1; font: 500 12px var(--mono); overflow-wrap: anywhere; }
.layer .bar { height: 14px; border-radius: 999px; overflow: hidden; background: radial-gradient(circle, rgba(11,27,61,.26) 1px, transparent 1.4px) 0 0 / 5px 5px; position: relative; }
.layer .bar i { position: absolute; inset: 0 auto 0 0; background: radial-gradient(circle, var(--cobalt) 1.6px, transparent 2px) 0 0 / 5px 5px; transition: width 1s cubic-bezier(.2,.8,.2,1); width: 0; }
.layer .pc { font: 500 12px var(--mono); text-align: right; }
.list { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.list li { padding: 18px 20px; background: var(--soft); border-radius: var(--r2); display: grid; gap: 8px; }
.list .top2 { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; }
.list .id { font: 400 26px/1 var(--display); color: var(--cobalt); }
.list .src { font: 500 12px var(--mono); color: var(--ink-2); }
.list .stmt { font: 17px/1.5 var(--serif); }
.list .why { font: 400 13px/1.55 var(--mono); color: var(--ink-2); overflow-wrap: anywhere; }
.list .rejected .id { text-decoration: line-through; text-decoration-color: var(--red); }
.rel { font: 600 11px var(--sans); letter-spacing: .08em; text-transform: uppercase; }
.rel.supports { color: #137a4a; } .rel.contradicts { color: var(--red); } .rel.qualifies { color: #9a6a00; }
.notes { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; align-content: start; }
.notes li { padding: 14px 18px; background: var(--soft); border-radius: var(--r2); display: grid; gap: 4px; }
.notes b { font: 600 12px var(--sans); letter-spacing: .06em; text-transform: uppercase; color: var(--cobalt); }
.notes span { font: 16.5px/1.5 var(--serif); overflow-wrap: anywhere; }
blockquote { margin: 0; padding: 4px 0 4px 14px; border-left: 3px solid var(--cobalt); border-radius: 2px; font: italic 16px/1.55 var(--serif); color: var(--ink-2); }
.hd { margin: 0 0 4px; font: 500 12px var(--sans); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); }

/* chat */
.chat { position: sticky; top: 84px; align-self: start; height: calc(100vh - 108px); min-height: 460px; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; background: var(--navy); color: var(--on-navy); border-radius: var(--r3); box-shadow: var(--shadow); overflow: hidden; }
.chat-head { display: flex; align-items: center; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--line-d); }
.chat-status { color: var(--on-navy-2); }
.chat-status.busy { color: #ffb28f; }
.chat-mode { color: var(--on-navy-2); text-transform: lowercase; letter-spacing: .04em; }
.chat-close { margin-left: 8px; background: none; border: 0; font: 300 28px/1 var(--sans); cursor: pointer; display: none; }
.chat-msgs { overflow-y: auto; padding: 18px 18px; display: flex; flex-direction: column; gap: 14px; scrollbar-width: thin; }
.bubble { max-width: 90%; display: grid; gap: 5px; animation: rise .35s cubic-bezier(.2,.8,.2,1) both; }
.bubble .who { font: 500 12px var(--sans); color: var(--on-navy-2); }
.bubble p { margin: 0; padding: 11px 16px; background: var(--navy-2); border-radius: 6px 20px 20px 20px; font: 15.5px/1.5 var(--serif); white-space: pre-wrap; overflow-wrap: anywhere; }
.bubble.you { align-self: flex-end; }
.bubble.you .who { text-align: right; }
.bubble.you p { background: var(--cobalt); color: #fff; border-radius: 20px 6px 20px 20px; }
.bubble.team p { border-radius: 6px 20px 20px 20px; box-shadow: inset 3px 0 0 var(--bc, var(--cobalt)); font-size: 14.5px; }
.bubble.typing p { padding: 11px 18px; width: max-content; }
.caret { display: block; width: 2px; height: 18px; background: var(--on-navy); border-radius: 2px; animation: blink 1s steps(2) infinite; }
.chat-foot { border-top: 1px solid var(--line-d); padding: 14px; display: grid; gap: 12px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { padding: 8px 15px; border: 1px solid var(--line-d2); border-radius: 999px; background: none; cursor: pointer; font: 500 13.5px var(--sans); white-space: nowrap; transition: background .2s, color .2s, border-color .2s; }
.chip:hover { background: var(--on-navy); color: var(--navy); border-color: var(--on-navy); }
.chip.go-chip { background: var(--cobalt); border-color: var(--cobalt); color: #fff; }
.chip.go-chip:hover { background: #2d68e6; border-color: #2d68e6; }
.chip:disabled { opacity: .5; cursor: not-allowed; }
.chat-form { display: grid; grid-template-columns: minmax(0, 1fr) 44px; gap: 8px; align-items: end; }
.chat-form textarea { resize: none; min-height: 44px; max-height: 150px; padding: 12px 16px; border: 1px solid var(--line-d2); border-radius: 22px; background: rgba(0,0,0,.2); color: var(--on-navy); font: 15px/1.45 var(--serif); }
.chat-form textarea:focus { outline: none; border-color: #6e9bf5; }
.send { width: 44px; height: 44px; border: 0; border-radius: 50%; background: var(--on-navy); color: var(--navy); font: 700 18px var(--sans); cursor: pointer; transition: background .2s, color .2s; }
.send:hover { background: var(--cobalt); color: #fff; }
.chat-fab { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: max(16px, env(safe-area-inset-bottom, 0px)); z-index: 25; display: none; align-items: center; gap: 9px; padding: 14px 24px; border: 0; border-radius: 999px; background: var(--cobalt); color: #fff; cursor: pointer; font: 600 15px var(--sans); box-shadow: 0 16px 30px -10px rgba(21,80,201,.7); }
.chat-fab b { background: #fff; color: var(--cobalt); font: 700 12px var(--mono); padding: 1px 8px; border-radius: 999px; }
.chat-fab b[hidden] { display: none; }
@media (max-width: 1260px) {
  .chat { position: fixed !important; right: 16px; bottom: 16px; top: auto; z-index: 26; width: min(430px, calc(100vw - 32px)); height: min(660px, calc(100vh - 32px)); min-height: 0; transform: translateY(calc(100% + 60px)); transition: transform .35s cubic-bezier(.2,.8,.2,1); box-shadow: 0 30px 80px rgba(11,27,61,.5); }
  body.chat-open .chat { transform: none; }
  .chat-close { display: block; }
  .chat-fab { display: inline-flex; }
  body.chat-open .chat-fab { display: none; }
}

/* lock + sheets */
.lock { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; padding: 22px; background: var(--bg); }
.lock[hidden] { display: none; }
.lock-card { width: min(420px, 100%); padding: 34px; background: var(--card); border-radius: var(--r3); box-shadow: var(--shadow); display: grid; gap: 16px; }
.lock-card h1 { margin: 0; font: 400 26px/1 var(--display); letter-spacing: .26em; text-transform: uppercase; }
.lock-card p { margin: 0; color: var(--ink-2); }
.lock-card input { width: 100%; padding: 13px 16px; border: 1px solid var(--rule); border-radius: var(--r1); background: #fff; color: var(--ink); font: 18px var(--mono); letter-spacing: .12em; }
.lock-error { min-height: 1.4em; color: var(--red); font: 500 13.5px var(--sans); }
.drawer { position: fixed; inset: 0; z-index: 60; display: grid; justify-items: end; background: rgba(11,27,61,.45); backdrop-filter: blur(3px); }
.drawer[hidden] { display: none; }
.sheet { width: min(620px, 100%); height: 100%; overflow-y: auto; background: var(--card); color: var(--ink); padding: 28px 32px 48px; border-radius: var(--r3) 0 0 var(--r3); display: grid; gap: 16px; align-content: start; animation: slide .35s cubic-bezier(.2,.8,.2,1) both; }
.sheet .no { font: 300 80px/.85 var(--display); color: var(--cobalt); letter-spacing: -.02em; }
.sheet .stmt { font: 22px/1.4 var(--serif); margin: 0; }
.sheet hr { border: 0; border-top: 1px solid var(--rule); margin: 4px 0; width: 100%; }
.sheet .kick { margin: 0; color: var(--cobalt); font: 600 12px var(--sans); letter-spacing: .08em; text-transform: uppercase; }
.sheet .act { justify-self: end; }
.lines { background: var(--soft); border-radius: var(--r1); padding: 10px 0; font: 12.5px/1.8 var(--mono); overflow-x: auto; }
.ln { display: grid; grid-template-columns: 3em minmax(0, 1fr); padding-right: 12px; }
.ln .n { text-align: right; padding-right: 12px; color: var(--ink-2); user-select: none; }
.ln .t { white-space: pre-wrap; overflow-wrap: anywhere; }
.ln.in { background: #e3ecfb; }
.ln.in .n { color: var(--cobalt); font-weight: 700; }
mark { background: #ffe58a; color: var(--ink); border-radius: 4px; padding: 0 2px; }
.facts { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 16px; margin: 0; }
.facts dt { font: 500 12px/2 var(--sans); letter-spacing: .04em; text-transform: uppercase; color: var(--ink-2); }
.facts dd { margin: 0; font: 13px/2 var(--mono); overflow-wrap: anywhere; }
.packet-note { padding: 12px 16px; background: var(--soft); border-radius: var(--r1); font: 15px/1.5 var(--serif); color: var(--ink-2); }
.packet-section { display: grid; gap: 8px; padding-top: 14px; border-top: 1px solid var(--rule); }
.packet-section h4 { margin: 0; font: 600 12px var(--sans); letter-spacing: .06em; text-transform: uppercase; color: var(--cobalt); }
.packet-objective { margin: 0; padding: 12px 14px; background: var(--soft); border-radius: var(--r1); white-space: pre-wrap; overflow-wrap: anywhere; font: 15px/1.5 var(--serif); }
.packet-dep { display: grid; gap: 6px; padding: 12px 14px; background: var(--soft); border-radius: var(--r1); }
.packet-dep pre { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; font: 12.5px/1.6 var(--mono); }
.packet-lines { max-height: 260px; overflow: auto; background: #fff; }
.toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); z-index: 90; max-width: calc(100vw - 32px); background: var(--navy); color: var(--on-navy); padding: 12px 22px; border-radius: 999px; font: 500 14px var(--sans); box-shadow: 0 20px 40px rgba(11,27,61,.4); }
.toast[hidden] { display: none; }

@keyframes drift { from { transform: translate(0, 0); } to { transform: translate(var(--dx, 20px), var(--dy, 24px)); } }
@keyframes rise { from { opacity: .3; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@keyframes dropin { 0% { opacity: .2; transform: translateY(-140px) rotate(9deg); } 55% { opacity: 1; transform: translateY(7px) rotate(-1.2deg); } 80% { transform: translateY(-3px); } 100% { transform: none; } }
@keyframes bob { from { transform: translateY(-30px) rotate(-3.6deg); } to { transform: translateY(-34px) rotate(-1.4deg); } }
@keyframes settle { 0% { transform: translateY(-16px) rotate(-1.5deg); } 55% { transform: translateY(4px); } 100% { transform: none; } }
@keyframes sweep { to { background-position: 0 170%; } }
@keyframes blink { 50% { opacity: .25; } }
@keyframes type { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
@keyframes march { to { background-position: 11px 0; } }
@keyframes focus { from { letter-spacing: .34em; opacity: .25; filter: blur(3px); } to { letter-spacing: .035em; opacity: 1; filter: none; } }
@keyframes slide { from { transform: translateX(48px); opacity: .4; } to { transform: none; opacity: 1; } }
@media (max-width: 760px) {
  .top { gap: 12px; padding: 10px 18px; margin: 10px 12px 0; }
  .top nav { display: none; }
  .logo { letter-spacing: .22em; white-space: nowrap; }
  .layout { padding-top: 20px; padding-bottom: 110px; }
  .p-head { padding: 14px 18px; }
  .title { padding: 0 18px; }
  .hint { padding: 0 18px; margin-bottom: 20px; }
  .shelfrow { margin: 0 14px; padding-left: 14px; padding-right: 14px; }
  .shelfrow::before { right: 14px; }
  .now, .p-foot, .paste { margin-left: 18px; margin-right: 18px; }
  .tabs { margin-left: 18px; max-width: calc(100% - 36px); }
  .pane { padding: 24px 18px 0; }
  .sig-in { padding: 20px; }
  .brief { padding: 18px; }
  .brief dd { font-size: 16px; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } html { scroll-behavior: auto; } }
</style>
</head>
<body>
<div class="lock" id="lock" hidden>
  <form class="lock-card" id="unlock-form">
    <h1>Res Loop</h1>
    <p>Password required.</p>
    <input id="password" type="password" autocomplete="current-password" aria-label="Password" required>
    <div class="lock-error" id="lock-error" role="alert"></div>
    <button class="go" type="submit">Unlock</button>
  </form>
</div>

<div id="app">
  <div class="numerals" id="numerals" aria-hidden="true"></div>
  <header class="top">
    <a class="logo" href="#shelf">Res Loop</a>
    <nav aria-label="Sections"><a href="#shelf">Shelf</a><a href="#brief">Brief</a><a href="#signal">Signal</a><a href="#report">Report</a></nav>
  </header>

  <div class="layout">
    <main>
      <section class="paper stage" id="shelf" aria-label="Shelf">
        <div class="p-head micro"><span>Res Loop</span><span id="stage-state">Ready</span></div>
        <h1 class="title" id="headline">Ask a question.</h1>
        <p class="hint" id="hint"></p>
        <div class="shelfrow src" id="row-src" data-label="Sources" role="list"></div>
        <div class="shelfrow team" id="row-team" data-label="Team"></div>
        <p class="now" id="now" aria-live="polite"></p>
        <div class="p-foot">
          <label class="act" for="file" tabindex="0" id="upload-label">Upload</label>
          <input id="file" type="file" accept=".md,.txt,.markdown,text/plain,text/markdown" multiple hidden>
          <button class="act" id="paste-toggle" type="button">Paste text</button>
          <button class="act" id="demo" type="button">Demo papers</button>
          <span class="spacer"></span>
          <button class="go" id="start" type="button">Start</button>
        </div>
        <form class="paste" id="paste" hidden>
          <input id="paste-name" placeholder="Name, e.g. smith-2024" required aria-label="Source name">
          <textarea id="paste-text" placeholder="Paste the text here" required aria-label="Source text"></textarea>
          <div><button class="act" type="submit">Add</button></div>
        </form>
      </section>

      <section class="brief" id="brief" aria-label="Brief">
        <h2 class="micro">Brief <span class="tag" id="ready">Collecting</span></h2>
        <dl id="brief-items"></dl>
      </section>

      <section class="signal" id="signal" aria-label="Signal">
        <canvas id="dither" aria-hidden="true"></canvas>
        <div class="sig-in">
          <div class="sig-l"><div class="code" id="code" aria-live="off"></div></div>
          <div class="sig-r">
            <div><div class="big" id="stat-claims">0</div><div class="cap">claims checked</div></div>
            <div><div class="big" id="stat-rejected" style="font-size:clamp(40px,4.4vw,56px)">0</div><div class="cap">quotes rejected</div></div>
            <div class="loadbar"><span id="sig-state">WAITING</span><div class="trk"><div class="bar"><i id="bar"></i></div><span id="pct">0%</span></div></div>
          </div>
          <div class="sig-side" id="sig-date"></div>
        </div>
      </section>

      <section class="paper rep hidden" id="report" aria-label="Report">
        <div class="p-head micro"><span>Res Loop</span><span><span id="report-outcome"></span> · <span id="report-meta"></span></span></div>
        <h2 class="title" id="report-title">Report</h2>
        <div class="tabs" role="tablist">
          <button class="tab" role="tab" data-pane="report" aria-selected="true">Report</button>
          <button class="tab" role="tab" data-pane="evidence" aria-selected="false">Evidence<sup id="n-evidence"></sup></button>
          <button class="tab" role="tab" data-pane="rejected" aria-selected="false">Rejected<sup id="n-rejected"></sup></button>
          <button class="tab" role="tab" data-pane="open" aria-selected="false">Open<sup id="n-open"></sup></button>
        </div>
        <div class="pane" id="pane-report"><div class="rep-grid"><article class="article" id="article"></article>
          <aside class="rail"><div><div class="num-big" id="report-n">0</div><div class="cap" id="report-cap">claims cited</div></div>
            <div><p class="hd">Where it came from</p><div id="layers"></div></div></aside></div></div>
        <div class="pane" id="pane-evidence" hidden><ul class="list" id="claims"></ul></div>
        <div class="pane" id="pane-rejected" hidden><ul class="list" id="rejections"></ul></div>
        <div class="pane" id="pane-open" hidden><div class="rep-grid"><ul class="notes" id="open"></ul><ul class="notes" id="limits"></ul></div></div>
      </section>
    </main>

    <aside class="chat" id="chat" aria-label="Chat">
      <header class="chat-head">
        <span class="logo">Res Loop</span>
        <span class="chat-status micro" id="chat-status"><span>Intake</span></span><span class="spacer"></span><span class="chat-mode micro" id="mode"></span>
        <button class="chat-close" id="chat-close" type="button" aria-label="Close chat">×</button>
      </header>
      <div class="chat-msgs" id="msgs" aria-live="polite"></div>
      <div class="chat-foot">
        <div class="chips">
          <button class="chip" id="chip-demo" type="button">Demo papers</button>
          <label class="chip" for="file" tabindex="0" id="chip-upload">Upload</label>
          <button class="chip go-chip" id="chip-start" type="button">Start</button>
        </div>
        <form class="chat-form" id="composer">
          <textarea id="input" rows="1" placeholder="Type here" aria-label="Message Res Loop"></textarea>
          <button class="send" type="submit" aria-label="Send">↑</button>
        </form>
      </div>
    </aside>
  </div>
  <button class="chat-fab" id="chat-fab" type="button" aria-label="Open chat">Chat <b id="unread" hidden>0</b></button>
</div>

<div class="drawer" id="drawer" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Details"></div></div>
<div class="toast" id="toast" role="alert" hidden></div>
<script>
(() => {
  "use strict";
  const $ = id => document.getElementById(id);
  // Build DOM nodes. Strings always become text nodes, never HTML.
  function h(tag, attrs, ...kids) {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v == null || v === false) continue;
      if (k === "class") el.className = v;
      else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? "" : String(v));
    }
    for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
    return el;
  }
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const narrow = matchMedia("(max-width: 1260px)");
  const state = { briefReady: false, sources: 0, running: false, reportShown: false, sourceList: [], question: "" };
  let sid = null, after = 0, report = null, busy = false, returnFocus = null, password = "", attempted = false;
  try { password = sessionStorage.getItem("studioPassword") || ""; } catch (_) { /* storage can be blocked */ }

  async function api(path, body) {
    const headers = { "Content-Type": "application/json", ...(password ? { Authorization: `Bearer ${password}` } : {}) };
    const res = await fetch(path, { method: body === undefined ? "GET" : "POST", headers, body: body === undefined ? undefined : JSON.stringify({ id: sid, ...body }) });
    const data = await res.json().catch(() => ({}));
    if (res.status === 401) lock();
    if (!res.ok) {
      if (/unknown session/.test(data.error || "")) restarted();
      throw new Error(data.error || `HTTP ${res.status}`);
    }
    return data;
  }
  // The lock appears only if the server asks for a password (HTTP 401).
  function lock() {
    password = ""; try { sessionStorage.removeItem("studioPassword"); } catch (_) {}
    $("lock").hidden = false; $("app").setAttribute("aria-hidden", "true"); $("app").inert = true;
    setTimeout(() => $("password").focus(), 0);
  }
  function unlock() { $("lock").hidden = true; $("app").removeAttribute("aria-hidden"); $("app").inert = false; }
  let recovering = false;
  function restarted() {
    if (recovering) return;
    recovering = true;
    toast("The server restarted. Reloading.");
    setTimeout(() => { location.href = location.pathname; }, 1600);
  }
  function toast(msg) { const t = $("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => { t.hidden = true; }, 4500); }

  // ---- atmosphere: drifting numerals, parallax, ticking while it works
  const NUMS = ["1", "2", "3", "4", "5", "6", "7", "II", "IV", "VI", "IX", "X", "8", "9"];
  function spawnNumerals() {
    let seed = 11; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    for (let i = 0; i < 24; i++) $("numerals").append(h("span", { class: "num",
      style: `left:${(rnd() * 96 + 2).toFixed(1)}%;top:${(rnd() * 96 + 2).toFixed(1)}%;--dx:${(rnd() * 56 - 28).toFixed(0)}px;--dy:${(rnd() * 64 - 32).toFixed(0)}px;--d:${(16 + rnd() * 26).toFixed(0)}s;--s:${(11 + rnd() * 7).toFixed(0)}px` }, NUMS[i % NUMS.length]));
  }
  if (!reduce) {
    let raf = 0;
    addEventListener("pointermove", e => {
      if (raf) return;
      raf = requestAnimationFrame(() => { raf = 0; $("numerals").style.transform = `translate(${((e.clientX / innerWidth) - .5) * -22}px, ${((e.clientY / innerHeight) - .5) * -22}px)`; });
    }, { passive: true });
    setInterval(() => {
      if (!document.body.classList.contains("working")) return;
      const n = document.querySelectorAll(".num"); const el = n[Math.floor(Math.random() * n.length)];
      if (el && /^\d+$/.test(el.textContent)) el.textContent = String((+el.textContent + 1) % 10);
    }, 700);
  }

  // ---- the pixel signal panel: ordered dither, alive while the team works
  function startDither() {
    const cv = $("dither"), ctx = cv.getContext("2d", { alpha: false });
    const W = 150, H = 62; cv.width = W; cv.height = H;
    const img = ctx.createImageData(W, H), d = img.data;
    const B = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
    const SKY = [199, 229, 247], LIGHT = [222, 241, 252], MID = [176, 214, 240], COB = [24, 82, 178];
    let last = 0, visible = true;
    new IntersectionObserver(es => { visible = es[0].isIntersecting; }).observe(cv);
    function draw(t) {
      const tt = t * .0006 * (document.body.classList.contains("working") ? 2.4 : 1);
      for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
        const nx = x / W, ny = y / H;
        const v = .5 + .28 * Math.sin(nx * 9 + tt * 2) + .22 * Math.sin(ny * 13 - tt * 1.6 + Math.sin(nx * 5 + tt) * 2.2) + .12 * Math.sin((nx + ny) * 22 - tt * 3);
        const th = (B[(y & 3) * 4 + (x & 3)] + .5) / 16;
        const c = (nx > .76 && ny < .36 && v < .3 * (1 - th)) ? COB : v > .6 + .3 * th ? LIGHT : v < .4 - .3 * th ? MID : SKY;
        const o = (y * W + x) * 4; d[o] = c[0]; d[o + 1] = c[1]; d[o + 2] = c[2]; d[o + 3] = 255;
      }
      ctx.putImageData(img, 0, 0);
    }
    if (reduce) { draw(5200); return; }
    (function loop(t) { requestAnimationFrame(loop); if (!visible || document.hidden || t - last < 70) return; last = t; draw(t); })(0);
  }

  // ---- chat
  let unread = 0;
  function typing(on) {
    $("typing")?.remove();
    if (on) $("msgs").append(h("div", { class: "bubble typing", id: "typing" }, h("span", { class: "who" }, "Intake"), h("p", {}, h("span", { class: "caret" }))));
    $("msgs").scrollTop = $("msgs").scrollHeight;
  }
  function addTurn(e, color) {
    const kind = e.role === "user" ? "you" : (["Intake", "Orchestrator", "Res Loop", "Scout"].includes(e.who) ? "agent" : "team");
    if (kind !== "you") typing(false);
    const b = h("div", { class: `bubble ${kind}` }, h("span", { class: "who" }, e.who || "Agent"), h("p", {}, e.text));
    if (color) b.style.setProperty("--bc", color);
    $("msgs").append(b); $("msgs").scrollTop = $("msgs").scrollHeight;
    if (narrow.matches && !document.body.classList.contains("chat-open") && kind !== "you") { unread += 1; $("unread").textContent = unread; $("unread").hidden = false; }
  }
  function openChat(open) {
    document.body.classList.toggle("chat-open", open);
    if (open) { unread = 0; $("unread").hidden = true; $("input").focus(); }
  }
  const asked = new Set();
  const ROLE_COLOR = { scout: "var(--lilac)", planner: "var(--yellow)", evidence_reader: "var(--orange)", writer: "var(--cobalt)", reviewer: "var(--pink)", quality: "var(--green)" };
  function askInChat(e) {
    for (const q of (e.questions || []).slice(0, 2)) {
      const key = e.id + "|" + q; if (asked.has(key)) continue; asked.add(key);
      addTurn({ role: "assistant", who: `${e.title} asks`, text: q }, ROLE_COLOR[e.role]);
    }
  }
  function chatStatus(text, busy) { $("chat-status").className = "chat-status micro" + (busy ? " busy" : ""); $("chat-status").lastChild.textContent = text; }

  // ---- brief, shown in the dark under the shelf
  function renderBrief(b, ready) {
    state.question = b.question || "";
    const t = $("headline"); t.textContent = b.question || "Ask a question.";
    const n = (b.question || "").length; t.className = "title" + (n > 200 ? " xl" : n > 80 ? " long" : "");
    const dl = $("brief-items"); dl.replaceChildren();
    const row = (label, body) => dl.append(h("dt", {}, label), h("dd", {}, body));
    if (b.context) row("Context", b.context);
    if (b.constraints && b.constraints.length) {
      const first = b.constraints.slice(0, 4), rest = b.constraints.slice(4);
      row("Constraints", [h("ul", {}, first.map(c => h("li", {}, c))),
        rest.length ? h("details", {}, h("summary", {}, `${rest.length} more`), h("ul", { style: "margin-top:8px" }, rest.map(c => h("li", {}, c)))) : null]);
    }
    if (b.open_questions && b.open_questions.length) row("Must answer", h("ul", {}, b.open_questions.map(q => h("li", {}, q))));
    if (!dl.children.length) dl.append(h("dd", { class: "empty", style: "grid-column:1/-1" }, "Empty until you answer a few questions."));
    $("ready").textContent = ready ? "Ready" : "Collecting"; $("ready").className = "tag" + (ready ? " ok" : "");
    state.briefReady = ready || !!b.question;
    updateHint(); updateStart();
  }
  function updateHint() {
    let t;
    if (state.running) t = "Click a spine to see what that agent was given.";
    else if (state.reportShown) t = "Done. Report below.";
    else if (!state.question) t = narrow.matches ? "Tap Chat and type your question." : "Type your question in the chat.";
    else if (!state.sources) t = "Put papers on the shelf, or start without them and a scout writes notes.";
    else t = "Press Start.";
    $("hint").textContent = t;
    $("stage-state").textContent = state.running ? "Running" : state.reportShown ? "Done" : "Ready";
  }
  function updateStart() {
    const label = state.running ? "Running" : (state.reportShown ? "Run again" : "Start");
    for (const id of ["start", "chip-start"]) { $(id).disabled = state.running; $(id).textContent = label; }
  }
  function missing() { return state.briefReady ? null : "First ask your question in the chat."; }

  // ---- the shelf: sources above, the team below
  const PALETTE = [["#1550c9", "#ffffff"], ["#f58ab6", "#3a0f22"], ["#f4b73f", "#3a2600"], ["#0b1b3d", "#eef3fb"], ["#f26a3d", "#3a1100"], ["#7fb7ee", "#08213f"], ["#26a672", "#05281a"], ["#a98be0", "#1d1233"]];
  const ROLES = { orchestrator: ["#0b1b3d", "#eef3fb", "Orchestrator", 214, 62], scout: ["#a98be0", "#1d1233", "Scout", 178, 52], planner: ["#f4b73f", "#3a2600", "Planner", 186, 56],
    evidence_reader: ["#f26a3d", "#3a1100", "Reader", 200, 62], writer: ["#1550c9", "#ffffff", "Writer", 212, 64], reviewer: ["#f58ab6", "#3a0f22", "Reviewer", 192, 58], quality: ["#26a672", "#05281a", "Quality gate", 206, 66] };
  const hash = s => { let x = 7; for (const c of s) x = (x * 31 + c.charCodeAt(0)) >>> 0; return x; };
  const roleOf = key => key.startsWith("reader:") ? "evidence_reader" : key.startsWith("writer:") ? "writer" : key;
  const cards = {}, spines = {}, srcSpines = {};

  function syncRow(parent, keys, map, make) {
    keys.forEach((key, i) => {
      let el = map[key];
      if (!el) { el = map[key] = make(key, i); el.style.setProperty("--i", i); }
      if (parent.querySelectorAll(":scope > .spine")[i] !== el) parent.insertBefore(el, parent.querySelectorAll(":scope > .spine")[i] || null);
    });
    for (const key of Object.keys(map)) if (!keys.includes(key)) { map[key].remove(); delete map[key]; }
  }
  function renderSources(list) {
    state.sourceList = list; state.sources = list.length;
    const keys = list.length ? list.map(s => s.id) : ["*"];
    syncRow($("row-src"), keys, srcSpines, key => key === "*"
      ? h("div", { class: "spine ghost", role: "listitem", style: "--w:64px;--h:196px;--c:transparent;--fg:inherit" }, h("span", { class: "t" }, "Drop files"))

  stage.addEventListener("dragover", e => { e.preventDefault(); stage.classList.add("drop"); });
  stage.addEventListener("dragleave", e => { if (!stage.contains(e.relatedTarget)) stage.classList.remove("drop"); });
  stage.addEventListener("drop", async e => { e.preventDefault(); stage.classList.remove("drop"); await addFiles(e.dataTransfer.files); });
  $("paste-toggle").addEventListener("click", () => { $("paste").hidden = !$("paste").hidden; if (!$("paste").hidden) $("paste-name").focus(); });
  $("paste").addEventListener("submit", async e => {
    e.preventDefault();
    try { await api("/api/source", { name: $("paste-name").value, text: $("paste-text").value }); $("paste").reset(); $("paste").hidden = true; } catch (err) { toast(err.message); }
  });
  const useDemo = async () => { try { await api("/api/demo", {}); } catch (err) { toast(err.message); } };
  $("demo").addEventListener("click", useDemo); $("chip-demo").addEventListener("click", useDemo);
  $("chip-start").addEventListener("click", () => $("start").click());
  $("chat-fab").addEventListener("click", () => openChat(true)); $("chat-close").addEventListener("click", () => openChat(false));
  $("start").addEventListener("click", async () => {
    const why = missing();
    if (why) { addTurn({ role: "assistant", who: "Res Loop", text: why }); openChat(true); toast(why); return; }
    state.running = true; updateStart();
    try { await api("/api/run", {}); } catch (err) { state.running = false; updateStart(); toast(err.message); }
  });

  async function startStudio() {
    try {
      const attach = new URLSearchParams(location.search).get("session");  // reopen an existing session
      const s = attach ? { id: attach, ...(await api("/api/info")) } : await api("/api/session", {});
      sid = s.id;
      const live = String(s.mode || "").startsWith("live");
      $("mode").textContent = live ? s.mode.split("·")[1].trim() : "demo";
      unlock(); renderBrief({}, false); poll();
      if (location.hash === "#chat") openChat(true); else if (!narrow.matches) $("input").focus();
    } catch (err) {
      if (!$("lock").hidden) { if (attempted) $("lock-error").textContent = "Incorrect password."; }
      else toast("Could not reach the studio server.");
    }
  }
  $("unlock-form").addEventListener("submit", async e => {
    e.preventDefault(); $("lock-error").textContent = "";
    attempted = true; password = $("password").value;
    try { sessionStorage.setItem("studioPassword", password); } catch (_) {}
    await startStudio();
  });

  spawnNumerals(); startDither();
  const d = new Date(); $("sig-date").textContent = `${String(d.getDate()).padStart(2, "0")}/${String(d.getMonth() + 1).padStart(2, "0")}/${String(d.getFullYear()).slice(2)}`;
  $("code").dataset.idle = "1"; setCode(IDLE);
  renderSources([]); renderBrief({}, false); updateHint();
  startStudio();
})();
</script>
</body>
</html>
